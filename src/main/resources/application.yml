server:
  port: ${PORT}

spring:
  application:
    name: record-service
  profiles:
    active: ${PROFILE}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jwt:
    key: ${JWT_KEY}
    access_exp_time: ${JWT_ACCESS_EXP_TIME}
    refresh_exp_time: ${JWT_REFRESH_EXP_TIME}

  h2:
    console:
      enabled: true

  management:
    endpoint:
      health:
        probes:
          enabled: true
    health:
      livenessState:
        enabled: true
      readinessState:
        enabled: true

  cloud:
    oci:
      compartment:
        static: ${OCI_COMPARTMENT}
      config:
        type: ${OCI_FILE}
      region:
        static: ${OCI_REGION}
      bucketname:
        static: ${OCI_BUCKETNAME}
      namespace:
        static: ${OCI_NAMESPACE}
      url:
        static: ${OCI_URL}
      base-profile-image-url: ${BASIC_PROFILE_IMAGE_URL}
      not-open-image-url: ${NOT_OPEN_IMAGE_URL}
      base-url: ${OCI_BASEURL:local/}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


cors:
  local: ${LOCAL}
  dev: ${DEV}
  front-localhost: ${FRONT_LOCAL}
  back-localhost: ${BACK_LOCAL}
  edge-service: ${EDGE_SERVICE}
  service-dev: ${SERVICE_DEV}
  back-dev: ${BACK_DEV}
  admin-dev: ${ADMIN_DEV}
  creator-dev: ${CREATOR_DEV}
  service-prod: ${SERVICE_PROD}
  admin-prod: ${ADMIN_PROD}
  creator-prod: ${CREATOR_PROD}


fcm:
  url: ${FCM_URL}
  path: ${FCM_CONFIG_PATH}
  credential: ${FCM_CREDENTIAL}
  projectId: ${FCM_PROJECT_ID}

oauth2:
  client:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      member-redirect-uri: ${KAKAO_MEMBER_REDIRECT_URI}
      creator-redirect-uri: ${KAKAO_CREATOR_REDIRECT_URI}
      admin-redirect-uri: ${KAKAO_ADMIN_REDIRECT_URI}

    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      member-redirect-uri: ${GOOGLE_MEMBER_REDIRECT_URI}
      creator-redirect-uri: ${GOOGLE_CREATOR_REDIRECT_URI}
      admin-redirect-uri: ${GOOGLE_ADMIN_REDIRECT_URI}

springdoc:
  swagger-ui:
    url: /docs/openapi3.json
    path: /api-docs/index.html

payment:
  toss:
    confirm-url: ${TOSS_CONFIRM_URL}
    secret-key: ${TOSS_TEST_SECRET_KEY}

management:
  tracing:
    sampling:
      probability: 1.0
#  otlp:
#    tracing:
#      endpoint: http://localhost:4318/v1/traces

stream:
  key:
    member-joined: ${MEMBER_JOINED_KEY}